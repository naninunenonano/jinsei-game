<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生すごろく Ver.0.1</title>
<style>
:root{font-family:system-ui,sans-serif;color:#263246;background:#eef4fa}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:14px}h1{font-size:1.5rem;margin:8px 0}.panel{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}button{border:0;border-radius:10px;background:#3267c8;color:white;padding:12px 16px;font-size:1rem;cursor:pointer}button:disabled{background:#aaa}.secondary{background:#68788d}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{background:#f2f5fa;padding:10px;border-radius:10px}.active{outline:2px solid #3267c8}.small{font-size:.85rem;color:#526276}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tile{padding:8px 3px;text-align:center;border-radius:7px;background:#e8eef7;font-size:.75rem;min-height:49px}.tile.stop{background:#ffe4b8}.tile.event{background:#e0f4e9}.tile.here{outline:3px solid #3267c8}#log{max-height:220px;overflow:auto;font-size:.9rem;line-height:1.6}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font-weight:700}details{margin-top:10px}summary{cursor:pointer}#boardTitle{margin-bottom:8px}
</style></head><body><main><h1>🎲 人生すごろく <small>Ver.0.1</small></h1>
<div class="panel"><div class="players" id="players"></div></div>
<div class="panel"><div class="status" id="status"></div><p id="message"></p><div class="choices" id="choices"></div><button id="roll">ルーレットを回す（1〜10）</button> <button id="reset" class="secondary">最初から</button></div>
<div class="panel"><b id="boardTitle">現在地付近</b><div class="board" id="board"></div><details><summary>遊び方</summary><p>4人で200マスを進み、最後の総資産を競います。黄色は必ず止まるストップマスです。職業は就職マスに止まると決まり、止まらなければフリーターのまま進みます。</p></details></div>
<div class="panel"><b>行動履歴</b><div id="log"></div></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const stops={40:'結婚',70:'住宅購入',165:'人生最大の賭け',180:'厚生年金',185:'決算'};
const names=['あなた','Bot A','Bot B','Bot C'];
let ps=[],turn=0,pending=false,ended=false,history=[];
const yen=n=>n.toLocaleString('ja-JP')+'万円';
function reset(){ps=names.map((name,i)=>({name,pos:0,money:100,job:'フリーター',salary:10,married:false,house:false,children:0,finished:false,rank:i}));turn=0;pending=false;ended=false;history=[];add('新しい人生が始まりました。');render()}
function add(s){history.unshift(s);history=history.slice(0,60)}
function tile(n){if(stops[n])return stops[n];if(n<=20&&n%3===0)return '就職';if(n>40&&n<95&&n%11===0)return '転職';if(n>40&&n<120&&n%13===0)return '昇進';if(n>90&&n<150&&n%17===0)return '出産';if(n%10===0)return '給料日';if(n%5===0)return 'イベント';return n%2===0?'収入':'支出'}
function render(){const p=ps[turn];$('players').innerHTML=ps.map((x,i)=>'<div class="player '+(i===turn&&!ended?'active':'')+'"><b>'+x.name+'</b><div class="small">'+x.pos+'/200マス · '+x.job+'</div><div>'+yen(x.money)+'</div><div class="small">'+(x.married?'既婚':'独身')+' / 子 '+x.children+'人 / '+(x.house?'持ち家':'賃貸')+'</div></div>').join('');
$('status').textContent=ended?'ゲーム終了':p.name+' の番';
$('roll').disabled=ended||pending||turn!==0;
$('message').textContent=ended?'最終順位：'+[...ps].sort((a,b)=>b.money-a.money).map((x,i)=>(i+1)+'位 '+x.name+' '+yen(x.money)).join(' ／ '):p.name+'：'+p.pos+'マス目';
let start=Math.max(1,Math.min(191,p.pos-4));$('boardTitle').textContent='マップ '+start+'〜'+(start+9);
$('board').innerHTML=Array.from({length:10},(_,i)=>{const n=start+i;return '<div class="tile '+(stops[n]?'stop':tile(n)==='イベント'?'event':'')+' '+(ps.some(x=>x.pos===n)?'here':'')+'"><b>'+n+'</b><br>'+tile(n)+'<br>'+ps.filter(x=>x.pos===n).map(x=>x.name==='あなた'?'🔵':'🤖').join('')+'</div>'}).join('');
$('log').innerHTML=history.map(x=>'<div>・'+x+'</div>').join('')}
function choose(question,opts,callback,botChoice=0){pending=true;render();$('message').textContent=question;$('choices').replaceChildren();if(turn===0){opts.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('choices').replaceChildren();pending=false;callback(i);finishAction()};$('choices').append(b)})}else{const i=botChoice;add(ps[turn].name+'：'+opts[i]+'を選択');pending=false;callback(i);finishAction()}}
function event(p,n){const type=tile(n);if(type==='就職'){const jobs=[['会社員',25],['公務員',22],['営業職',30],['技術者',28]];const job=jobs[Math.floor(Math.random()*jobs.length)];p.job=job[0];p.salary=job[1];add(p.name+'が'+p.job+'に就職！');return}
if(type==='転職'){choose('転職しますか？',['転職する','今の仕事を続ける'],i=>{if(i===0){p.job='専門職';p.salary=35;add(p.name+'が転職した')}},Math.random()<.5?0:1);return}
if(type==='昇進'){if(p.job!=='フリーター'){p.salary+=8;add(p.name+'が昇進！ 給料+8万円')}else{add(p.name+'は昇進できなかった')}return}
if(type==='出産'){if(p.married){p.children++;p.money-=30;add(p.name+'に子どもが誕生！ -30万円')}else add(p.name+'は出産イベントなし');return}
if(type==='給料日'){return}
if(type==='イベント'){const events=[['臨時ボーナス',30],['旅行',-25],['宝くじ当選',70],['家電の故障',-35],['親戚からお祝い',20],['病院代',-15]];const e=events[Math.floor(Math.random()*events.length)];p.money+=e[1];add(p.name+'：'+e[0]+' '+(e[1]>0?'+':'')+yen(e[1]));return}
const delta=type==='収入'?10+Math.floor(Math.random()*31):-(5+Math.floor(Math.random()*26));p.money+=delta;add(p.name+'：'+type+' '+(delta>0?'+':'')+yen(delta))}
function stopEvent(p,n){switch(n){case 40:choose('結婚の節目。結婚しますか？',['結婚する（-50万円）','独身で進む'],i=>{if(i===0){p.married=true;p.money-=50;add(p.name+'が結婚した')}else add(p.name+'は独身を選んだ')},0);break;
case 70:choose('家を購入しますか？',['購入する（-200万円）','賃貸を続ける'],i=>{if(i===0){p.house=true;p.money-=200;add(p.name+'が家を購入した')}},p.money>100?0:1);break;
case 165:choose('人生最大の賭け！ 100万円を賭けますか？',['賭ける','賭けない'],i=>{if(i===0){const win=Math.random()<.5;p.money+=win?200:-100;add(p.name+'：賭けに'+(win?'成功！ +200万円':'失敗… -100万円'))}else add(p.name+'は賭けを見送った')},p.money>100?0:1);break;
case 180:const pension=p.job==='フリーター'?30:150;p.money+=pension;add(p.name+'：厚生年金関連の仮イベント +'+yen(pension));break;
case 185:if(p.money<0){add(p.name+'：決算、借金 '+yen(-p.money)+'を確認')}else add(p.name+'：決算、現金 '+yen(p.money)+'を確認');break}}
function finishAction(){render();if(pending)return;const p=ps[turn];if(p.pos>=200){p.finished=true;add(p.name+'がゴール！')}if(ps.every(x=>x.finished)){ended=true;render();return}let tries=0;do{turn=(turn+1)%ps.length;tries++}while(ps[turn].finished&&tries<=ps.length);render();if(turn!==0&&!ended){setTimeout(()=>{if(!pending&&!ended&&turn!==0)roll()},550)}}
function roll(){if(pending||ended)return;const p=ps[turn];const n=1+Math.floor(Math.random()*10);let target=Math.min(200,p.pos+n);const stop=Object.keys(stops).map(Number).find(s=>s>p.pos&&s<=target);if(stop)target=stop;const previous=p.pos;p.pos=target;add(p.name+'が'+n+'を出して'+target+'マス目へ');for(let square=previous+1;square<=target;square++){if(tile(square)==='給料日'){p.money+=p.salary;add(p.name+'が'+square+'マス目の給料日を通過：+'+yen(p.salary))}}render();if(stop)stopEvent(p,stop);else if(target<200)event(p,target);if(!pending)finishAction()}
$('roll').addEventListener('click',roll);$('reset').addEventListener('click',reset);reset();
})();
</script></body></html>
