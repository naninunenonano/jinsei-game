<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生すごろく Ver.0.1.17</title>
<style>
:root{font-family:system-ui,sans-serif;color:#263246;background:#eef4fa}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:14px}h1{font-size:1.5rem;margin:8px 0}.panel{background:white;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 9px #0001}button{border:0;border-radius:10px;background:#3267c8;color:white;padding:12px 16px;font-size:1rem;cursor:pointer}button:disabled{background:#aaa}.secondary{background:#68788d}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{background:#f2f5fa;padding:10px;border-radius:10px}.portrait{width:54px;height:54px;object-fit:cover;border-radius:8px;float:left;margin-right:8px}.char-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%}.char-grid button{padding:5px;background:#e8eef7;color:#263246;font-size:.85rem}.char-grid img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:5px;display:block}.active{outline:2px solid #3267c8}.small{font-size:.85rem;color:#526276}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tile{padding:8px 3px;text-align:center;border-radius:7px;background:#e8eef7;font-size:.75rem;min-height:49px}.tile.stop{background:#ffe4b8}.tile.event{background:#e0f4e9}.tile.here{outline:3px solid #3267c8}#log{max-height:220px;overflow:auto;font-size:.9rem;line-height:1.6}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{font-weight:700}details{margin-top:10px}summary{cursor:pointer}#boardTitle{margin-bottom:8px}
</style></head><body><main><h1>🎲 人生すごろく <small>Ver.0.1.17</small></h1>
<div class="panel"><div class="players" id="players"></div></div>
<div class="panel"><div class="status" id="status"></div><p id="message"></p><div class="choices" id="choices"></div><button id="roll">ルーレットを回す（1〜10）</button> <button id="reset" class="secondary">最初から</button></div>
<div class="panel"><b id="boardTitle">現在地付近</b><div class="board" id="board"></div><details><summary>遊び方</summary><p>4人で200マスを進み、最後の総資産を競います。黄色は必ず止まるストップマスです。最初に就活コースかサラリーマンコースを選びます。就活は職業マスにぴったり止まると就職し、13マス目で合流します。給料日は通過でも受給できます。お宝は各種類先着1人のみ獲得でき、ゴール時に評価額の2倍を資産計上します。住宅はゴール時に購入価格の3倍で売却します。190マス目の決算では借金返済のため資産を売却し、それでも借金が残ると蟹工船で毎ターン出目×1,000円を返済します。</p></details></div>
<div class="panel"><b>行動履歴</b><div id="log"></div></div></main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),names=['あなた','Bot A','Bot B','Bot C'];
const stops={40:'結婚',50:'住宅購入',165:'人生最大の賭け',180:'厚生年金',190:'決算'};
const houses=[{name:'集合住宅',price:5000,shared:true},{name:'一戸建て',price:10000},{name:'高級住宅',price:20000},{name:'豪邸',price:30000}];
const retirement={191:['孫にお小遣い',p=>-10000*2**p.children],192:['埋蔵金を発見！',()=>500000],193:['世界一周旅行',()=>-150000],194:['宇宙人に遭遇！',()=>100000],195:['長寿のお祝い',()=>50000],196:['自伝が大ヒット',()=>300000],197:['詐欺に引っかかる',()=>-200000],198:['月面旅行',()=>-1000000],199:['豪華客船で世界旅行',()=>-250000]};
const earlyEvents={"15":["初めての飲み会",-5000],"16":["仕事で成果を出した！",10000],"17":["スマホを買い替える",-10000],"18":["上司からご褒美",5000],"19":["休日に旅行へ",-15000],"21":["臨時ボーナス！",20000],"22":["友人の結婚式に出席",-20000],"24":["趣味に散財！",-12000],"25":["同窓会に参加",-8000],"26":["会社の飲み会で奢ってもらう",3000],"27":["家電が故障！",-10000],"29":["新しい服を買う",-6000],"31":["副収入を得た",8000],"32":["引っ越し費用",-20000],"34":["友人と食事",-5000],"35":["特別手当",10000],"36":["体調を崩して通院",-3000],"38":["帰省のお土産",-7000],"39":["結婚前の貯金を発見",5000]};
const familyEvents={41:['新生活の家具を購入',-30000],42:['結婚祝いのお返し',-20000],43:['仕事で臨時ボーナス',15000],44:['新生活の家電を購入',-25000],48:['家族旅行',-20000],49:['仕事で特別手当',10000]};
const specialEvents={23:'昔のおもちゃを発見！',28:'急な出世！',33:'昔のプロモカードを発見！',37:'Vtuberデビュー！'};
const treasures={23:{name:'昔のおもちゃ',value:20000},33:{name:'昔のプロモカード',value:50000}};
const jobs={5:['先生','fixed',15000],6:['医者','fixed',30000],7:['料理人','fixed',20000],8:['スポーツ選手','once',250000],9:['研究者','fixed',25000],10:['漫画家','spin',3000],11:['政治家','fixed',30000],12:['芸能人','spin',3000]};
let ps=[],turn=0,pending=false,ended=false,history=[],finishOrder=[];
const yen=n=>n.toLocaleString('ja-JP')+'円',spin=()=>1+Math.floor(Math.random()*10);
function add(s){history.unshift(s);history=history.slice(0,70)}
const characters=Array.from({length:8},(_,i)=>({id:(i<4?'M':'F')+(i%4+1),name:(i<4?'男性':'女性')+(i%4+1),gender:i<4?'男性':'女性'}));const charImage=id=>'images/characters/'+id+'.png';
function reset(){ps=names.map((name,i)=>({name,pos:0,money:30000,job:'未就職',payType:'none',payRate:0,route:null,skip:0,firstPay:false,contractPaid:false,insured:false,married:false,gender:null,character:null,spouse:null,house:null,treasures:[],children:0,pensionJoined:null,finished:false,crab:false,rank:i}));turn=0;pending=false;ended=false;history=[];finishOrder=[];add('新しい人生が始まりました。');render();startCharacter()}
function startCharacter(){const p=ps[0];pending=true;render();$('message').textContent='使用するキャラクターを選んでください';const root=$('choices');root.replaceChildren();root.className='choices char-grid';for(const c of characters){const b=document.createElement('button');const img=document.createElement('img');img.src=charImage(c.id);img.alt=c.name;img.onerror=()=>{img.style.display='none'};b.append(img,document.createTextNode(c.name));b.onclick=()=>{p.character=c.id;p.gender=c.gender;const remaining=characters.filter(x=>x.id!==c.id);for(let i=1;i<ps.length;i++){const ix=Math.floor(Math.random()*remaining.length);const bot=remaining.splice(ix,1)[0];ps[i].character=bot.id;ps[i].gender=bot.gender}root.className='choices';root.replaceChildren();pending=false;add('あなたは'+c.name+'を選択');render();startRoute()};root.append(b)}}
function startRoute(){const p=ps[turn];choose('最初のコースを選んでください',['就活コース（12マス）','サラリーマンコース（5マス）'],i=>{p.route=i===0?'job':'salary';add(p.name+'：'+(i===0?'就活':'サラリーマン')+'コースを選択')},turn===0?0:Math.floor(Math.random()*2))}
function celebrate(p,reason){const gift=reason==='結婚'?10000:reason==='出産'?10000:5000;for(const o of ps){if(o===p)continue;o.money-=gift;p.money+=gift}add(p.name+'の'+reason+'祝い：他の3人から各'+yen(gift))}
function tile(n,p){if(retirement[n])return retirement[n][0];if(n===200)return 'ゴール';if(n<=4)return ({1:'面接準備',2:'小さな親切',3:'フリーター',4:'休憩'})[n];if(n<=12){if(p&&p.route==='salary')return n===5?'会社員 STOP':'合流前';return jobs[n]?jobs[n][0]+'就職':'就活終了'}if(n===13||n===185)return '給料日';if(n===14)return 'いきなり倒産！？';if(specialEvents[n])return specialEvents[n];if(n===45)return '配偶者のおじいちゃんの遺産';if(n===46)return '予期せぬ妊娠';if(n===47)return '配偶者が特殊詐欺に遭う';if(familyEvents[n])return familyEvents[n][0];if(earlyEvents[n])return earlyEvents[n][0];if(stops[n])return stops[n];if(n>40&&n<95&&n%11===0)return '転職';if(n>40&&n<120&&n%13===0)return '昇進';if(n>90&&n<150&&n%17===0)return '出産';if(n>13&&n<185&&n%10===0)return '給料日';if(n%5===0)return 'イベント';return n%2===0?'収入':'支出'}
function render(){const p=ps[turn];$('players').innerHTML=ps.map((x,i)=>'<div class="player '+(i===turn&&!ended?'active':'')+'"><img class="portrait" src="'+(x.character?charImage(x.character):'')+'" onerror="this.style.display=\'none\'" alt=""><b>'+x.name+(x.character?'（'+characters.find(c=>c.id===x.character).name+'）':'')+'</b><div class="small">'+x.pos+'/200マス · '+x.job+' · '+(x.gender||'未選択')+'</div><div>'+yen(x.money)+'</div><div class="small">'+(x.married?'既婚・配偶者 '+(x.spouse?characters.find(c=>c.id===x.spouse).name:'未設定'):'独身')+' / 子 '+x.children+'人 / '+(x.house?x.house.name:'賃貸')+' / お宝 '+x.treasures.map(t=>t.name).join('・')+(x.treasures.length?'':'なし')+' / 保険'+(x.insured?'あり':'なし')+(x.crab?' / 🦀蟹工船':'')+'</div></div>').join('');
$('status').textContent=ended?'ゲーム終了':p.name+' の番';$('roll').disabled=ended||pending||turn!==0;$('message').textContent=ended?'最終順位：'+[...ps].sort((a,b)=>b.money-a.money).map((x,i)=>(i+1)+'位 '+x.name+' '+yen(x.money)).join(' ／ '):p.name+'：'+p.pos+'マス目';
const start=Math.max(1,Math.min(191,p.pos-4));$('boardTitle').textContent='マップ '+start+'〜'+(start+9);$('board').innerHTML=Array.from({length:10},(_,i)=>{const n=start+i;return '<div class="tile '+(stops[n]||(n===5&&p.route==='salary')?'stop':tile(n,p)==='イベント'?'event':'')+' '+(ps.some(x=>x.pos===n)?'here':'')+'"><b>'+n+'</b><br>'+tile(n,p)+'<br>'+ps.filter(x=>x.pos===n).map(x=>x.name==='あなた'?'🔵':'🤖').join('')+'</div>'}).join('');$('log').innerHTML=history.map(x=>'<div>・'+x+'</div>').join('')}
function choose(question,opts,callback,botChoice=0){pending=true;render();$('message').textContent=question;$('choices').replaceChildren();if(turn===0){opts.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{$('choices').replaceChildren();pending=false;callback(i);if(!pending)finishAction()};$('choices').append(b)})}else{const i=Math.max(0,Math.min(opts.length-1,botChoice));add(ps[turn].name+'：'+opts[i]+'を選択');pending=false;callback(i);if(!pending)finishAction()}}
function setJob(p,name,type,rate){p.job=name;p.payType=type;p.payRate=rate;add(p.name+'が'+name+'になった')}
function payday(p,n){let pay=0;if(p.payType==='fixed')pay=p.payRate;else if(p.payType==='spin'){const v=spin();pay=v*p.payRate;add(p.name+'の給料ルーレット：'+v)}else if(p.payType==='once'&&!p.contractPaid){pay=p.payRate;p.contractPaid=true}p.money+=pay;add(p.name+'：'+n+'マス目の給料日 +'+yen(pay));if(!p.firstPay){p.firstPay=true;choose('最初の給料日です。自動車保険（1,000円）と年金（10,000円）を選んでください',['両方加入（11,000円）','自動車保険のみ（1,000円）','年金のみ（10,000円）','どちらも加入しない'],i=>{p.insured=i===0||i===1;p.pensionJoined=i===0||i===2;const cost=(p.insured?1000:0)+(p.pensionJoined?10000:0);p.money-=cost;add(p.name+'：保険・年金の加入費用 -'+yen(cost))},p.money>=11000?0:p.money>=1000?1:3);return true}return false}
function collide(p){const others=ps.filter(o=>o!==p&&!o.finished&&o.pos===p.pos);if(!others.length||p.pos===13||p.pos>=200)return;const o=others[0];if(p.insured){p.insured=false;add(p.name+'が'+o.name+'に追突：自動車保険を使用（1回で消滅）')}else{p.money-=10000;o.money+=10000;add(p.name+'が'+o.name+'に追突：'+yen(10000)+'を賠償')}}
function land(p,n){if(n===1){p.money-=5000;add(p.name+'：面接準備 -'+yen(5000));return}if(n===2){setJob(p,'役員','fixed',30000);p.pos=13;add(p.name+'：親切のお礼で役員に就任、13マスへ');payday(p,13);return}if(n===3){setJob(p,'フリーター','spin',1000);p.pos=13;add(p.name+'：13マスへ');payday(p,13);return}if(n===4){p.skip=1;add(p.name+'：休憩、次の番を1回休む');return}if(n>=5&&n<=12){if(p.route==='salary'){setJob(p,'会社員','spin',2000);p.pos=13;payday(p,13);return}const j=jobs[n];if(j){setJob(p,...j);p.pos=13;add(p.name+'：13マスへ');payday(p,13)}return}if(n===13){if(p.job==='未就職')setJob(p,'フリーター','spin',1000);payday(p,13);return}if(stops[n]){stopEvent(p,n);return}event(p,n)}
function event(p,n){if(retirement[n]){const [name,calculate]=retirement[n];const amount=calculate(p);p.money+=amount;add(p.name+'：'+name+' '+(amount>=0?'+':'')+yen(amount));return}if(n===14){setJob(p,'フリーター','spin',1000);add(p.name+'：いきなり倒産！？ フリーターになった');return}if(n===28){if(p.job==='会社員')setJob(p,'部長','fixed',22000);else add(p.name+'：急な出世！ 会社員ではないため変化なし');return}if(n===37){if(p.job==='フリーター')setJob(p,'Vtuber','spin',4000);else add(p.name+'：Vtuberデビュー！ フリーターではないため変化なし');return}if(treasures[n]){const t=treasures[n];if(ps.some(x=>x.treasures.some(y=>y.name===t.name))){add(p.name+'：'+t.name+'はすでに獲得済み');return}p.treasures.push(t);add(p.name+'：先着で'+t.name+'（評価額'+yen(t.value)+'）を獲得！');return}if(n===45){if(p.married&&!p.house){p.house={name:'タワーマンション',price:25000};add(p.name+'：配偶者のおじいちゃんからタワーマンション（資産価値25,000円）を相続')}else add(p.name+'：相続なし（未婚または住宅所有済み）');return}if(n===46){if(!p.married&&p.gender==='男性'){p.money-=100000;add(p.name+'：交際相手との妊娠トラブル -'+yen(100000));return}p.children++;p.money-=50000;add(p.name+'：子どもが誕生！ 出産費用 -'+yen(50000));if(p.married)celebrate(p,'出産');return}if(n===47){if(p.married){p.money-=200000;add(p.name+'：配偶者が特殊詐欺に遭う -'+yen(200000))}else add(p.name+'：未婚のため被害なし');return}if(familyEvents[n]){let [name,amount]=familyEvents[n];if(n===42&&!p.married){add(p.name+'：未婚のためお返しなし');return}if(n===48&&!p.married){name='老後のために貯金';amount=20000}p.money+=amount;add(p.name+'：'+name+' '+(amount>=0?'+':'')+yen(amount));return}if(earlyEvents[n]){const [name,amount]=earlyEvents[n];p.money+=amount;add(p.name+'：'+name+' '+(amount>=0?'+':'')+yen(amount));return}const type=tile(n,p);if(type==='転職'){choose('転職しますか？',['会社員になる','今の仕事を続ける'],i=>{if(i===0)setJob(p,'会社員','spin',2000)},1);return}if(type==='昇進'){if(p.job==='会社員'){setJob(p,'社長','fixed',40000)}else add(p.name+'：キャリアアップは今後拡張予定');return}if(type==='出産'){if(!p.married&&p.gender==='男性'){p.money-=100000;add(p.name+'：交際相手との妊娠トラブル -'+yen(100000))}else{p.children++;p.money-=50000;add(p.name+'に子どもが誕生！ -'+yen(50000));if(p.married)celebrate(p,'出産')}return}if(type==='給料日')return;
if(type==='イベント'){const events=[['臨時ボーナス',3000],['旅行',-2500],['宝くじ当選',7000],['家電の故障',-3500],['親戚からお祝い',2000],['病院代',-1500]];const e=events[Math.floor(Math.random()*events.length)];p.money+=e[1];add(p.name+'：'+e[0]+' '+(e[1]>0?'+':'')+yen(e[1]));return}const delta=type==='収入'?1000+Math.floor(Math.random()*3100):-(500+Math.floor(Math.random()*2600));p.money+=delta;add(p.name+'：'+type+' '+(delta>0?'+':'')+yen(delta))}
function sellAssetsForDebt(p){if(p.money>=0)return;for(const t of [...p.treasures]){if(p.money>=0)break;p.treasures=p.treasures.filter(x=>x!==t);const sale=Math.floor(t.value*0.5);p.money+=sale;add(p.name+'：決算で'+t.name+'を売却 +'+yen(sale))}if(p.money>=0)return;if(p.house){const h=p.house;p.house=null;const sale=Math.floor(h.price*0.5);p.money+=sale;add(p.name+'：決算で'+h.name+'を売却 +'+yen(sale))}}
function settle(p){add(p.name+'：決算開始 現金 '+yen(p.money));sellAssetsForDebt(p);if(p.money<0){p.crab=true;add(p.name+'：借金 '+yen(-p.money)+'が残り、🦀蟹工船送り')}else add(p.name+'：決算完了 現金 '+yen(p.money))}
function workCrab(p){const n=spin(),pay=Math.min(-p.money,n*1000);p.money+=pay;add(p.name+'：🦀蟹工船 '+n+'×1,000円、'+yen(pay)+'を返済。残債 '+yen(Math.max(0,-p.money)));if(p.money>=0){p.money=0;p.crab=false;add(p.name+'：借金完済！ 次の手番から移動再開')}}
function stopEvent(p,n){switch(n){case 40:choose('結婚の節目。結婚しますか？',['結婚する（-50,000円）','独身で進む'],i=>{if(i!==0)return;const used=new Set(ps.map(x=>x.character).concat(ps.map(x=>x.spouse)).filter(Boolean));const candidates=characters.filter(c=>c.gender!==p.gender&&!used.has(c.id));const marry=c=>{p.married=true;p.spouse=c.id;p.money-=50000;celebrate(p,'結婚');add(p.name+'が'+c.name+'と結婚した')};if(!candidates.length){add(p.name+'：結婚相手の候補がいないため結婚を見送り');return}if(turn===0){choose('結婚相手を選んでください',candidates.map(c=>c.name),j=>marry(candidates[j]),0)}else marry(candidates[Math.floor(Math.random()*candidates.length)])},0);break;
case 50:{if(p.house){add(p.name+'：すでに'+p.house.name+'を所有しているため購入なし');break}const available=houses.filter(h=>h.price<=p.money&&(h.shared||!ps.some(o=>o.house&&o.house.name===h.name)));const opts=available.map(h=>h.name+'（'+yen(h.price)+'）').concat('購入しない');const pick=available.length?available.reduce((best,h,i)=>h.price>available[best].price?i:best,0):0;choose('住宅購入：借金での購入はできません。',opts,i=>{if(i<available.length){const h=available[i];if(p.money<h.price)return;p.house=h;p.money-=h.price;add(p.name+'が'+h.name+'を'+yen(h.price)+'で購入')}},pick);break}
case 165:choose('人生最大の賭け！ 10,000円を賭けますか？',['賭ける','賭けない'],i=>{if(i===0){const win=Math.random()<.5;p.money+=win?20000:-10000;add(p.name+'：賭けに'+(win?'成功 +20,000円':'失敗 -10,000円'))}},p.money>=10000?0:1);break;
case 180:const amount=p.pensionJoined?150000:0;p.money+=amount;add(p.name+'：年金 '+(p.pensionJoined?'+'+yen(amount):'未加入'));break;
case 190:settle(p);break}}
function finishAction(){render();if(pending)return;const p=ps[turn];if(p.pos>=200&&!p.finished){p.finished=true;for(const t of p.treasures){p.money+=t.value*2;add(p.name+'：お宝'+t.name+'を'+yen(t.value*2)+'で資産計上')}p.treasures=[];if(p.house){const sale=p.house.price*3;p.money+=sale;add(p.name+'が'+p.house.name+'を'+yen(sale)+'で売却');p.house=null}finishOrder.push(p.name);const bonus=[100000,50000,25000,0][finishOrder.length-1];p.money+=bonus;add(p.name+'が'+finishOrder.length+'位でゴール！ 到着ボーナス +'+yen(bonus))}if(ps.every(x=>x.finished)){ended=true;render();return}let tries=0;do{turn=(turn+1)%ps.length;tries++}while(ps[turn].finished&&tries<=ps.length);render();if(turn!==0&&!ended)setTimeout(()=>{if(!pending&&!ended&&turn!==0)roll()},550)}
function roll(){if(pending||ended)return;const p=ps[turn];if(!p.character){if(turn===0)startCharacter();return}if(!p.route){startRoute();return}if(p.crab){workCrab(p);finishAction();return}if(p.skip>0){p.skip--;add(p.name+'は休憩で1回休み');finishAction();return}const n=spin(),previous=p.pos;let target=Math.min(200,previous+n);if(previous<13){if(p.route==='salary'&&target>=5)target=5;else if(target>=13)target=13}else{const stop=Object.keys(stops).map(Number).find(x=>x>previous&&x<=target);if(stop)target=stop}p.pos=target;add(p.name+'が'+n+'を出して'+target+'マス目へ');
if(previous<13){if(target===5&&p.route==='salary'){land(p,5)}else if(target===13){land(p,13)}else if(target<=12){land(p,target)}else{setJob(p,'フリーター','spin',1000);p.pos=13;payday(p,13)}}else{for(let sq=previous+1;sq<=target;sq++){if(tile(sq,p)==='給料日'||sq===50){if(payday(p,sq))break}}if(!pending&&target<200&&(tile(target,p)!=='給料日'||target===50))land(p,target)}
collide(p);if(!pending)finishAction()}
$('roll').addEventListener('click',roll);$('reset').addEventListener('click',reset);reset();
})();
